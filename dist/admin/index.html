         the icon and name its notifications are shown under. -->

    <!-- Icons are the store's, under /assets/img — the admin bundle ships none

         with a 200, so a wrong path here fails silently. -->

    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/icon-32.png" />
